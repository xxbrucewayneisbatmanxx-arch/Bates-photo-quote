services:
  - type: web
    name: bates-photo-quote
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: BRAND_NAME
        value: Bates Plumbing
      - key: BRAND_TRADE
        value: plumbing
      - key: BRAND_TAGLINE
        value: "Plumbing · Nevada, MO"
      - key: BRAND_DEMO_LABEL
        value: "Demo — sample photo-quote tool built for Bates Plumbing"
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_API_KEY
        sync: false
      - key: MAKE_WEBHOOK_URL
        sync: false
